<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <video id="comedian1" src="./comedian1.mp4" preload="auto" loop playsinline></video>
        <video id="comedian2" src="./comedian2.mp4" preload="auto" loop playsinline></video>
        <video id="comedian3" src="./comedian3.mp4" preload="auto" loop playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Brahmanandam - Image Target 0 -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#comedian1" position="0 0 0" width="1" height="0.6" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- Ali - Image Target 1 -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-video src="#comedian2" position="0 0 0" width="1" height="0.6" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- Sunil - Image Target 2 -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-video src="#comedian3" position="0 0 0" width="1" height="0.6" rotation="0 0 0"></a-video>
      </a-entity>

    </a-scene>
  </body>
</html>
