<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>MEMEVERSE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <script>
    AFRAME.registerComponent("comic-frame", {
      schema: {
        innerWidth: { type: "number", default: 1 },
        innerHeight: { type: "number", default: 0.55 },
        borderScale: { type: "number", default: 1.14 }
      },

      init: function () {
        const THREE = AFRAME.THREE;
        const { innerWidth, innerHeight, borderScale } = this.data;

        const outerW = innerWidth * borderScale;
        const outerH = innerHeight * borderScale;

        const canvas = document.createElement("canvas");
        canvas.width = 1024;
        canvas.height = Math.round(1024 * (outerH / outerW));

        const ctx = canvas.getContext("2d");

        const marginFrac = (borderScale - 1) / (2 * borderScale);
        const mx = canvas.width * marginFrac;
        const my = canvas.height * marginFrac;

        const outerRadius = canvas.width * 0.035;
        const innerRadius = canvas.width * 0.018;

        function roundedRectPath(x, y, w, h, radius) {
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.arcTo(x + w, y, x + w, y + h, radius);
          ctx.arcTo(x + w, y + h, x, y + h, radius);
          ctx.arcTo(x, y + h, x, y, radius);
          ctx.arcTo(x, y, x + w, y, radius);
          ctx.closePath();
        }

        ctx.save();
        ctx.shadowColor = "rgba(36, 26, 20, 0.35)";
        ctx.shadowBlur = canvas.width * 0.025;
        ctx.shadowOffsetY = canvas.width * 0.012;

        roundedRectPath(0, 0, canvas.width, canvas.height, outerRadius);
        ctx.fillStyle = "#F7EFD9";
        ctx.fill();
        ctx.restore();

        roundedRectPath(0, 0, canvas.width, canvas.height, outerRadius);
        ctx.lineWidth = canvas.width * 0.014;
        ctx.strokeStyle = "#241A14";
        ctx.stroke();

        ctx.save();
        ctx.globalCompositeOperation = "destination-out";
        roundedRectPath(mx, my, canvas.width - mx * 2, canvas.height - my * 2, innerRadius);
        ctx.fill();
        ctx.restore();

        roundedRectPath(mx, my, canvas.width - mx * 2, canvas.height - my * 2, innerRadius);
        ctx.lineWidth = canvas.width * 0.009;
        ctx.strokeStyle = "#241A14";
        ctx.stroke();

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        texture.colorSpace = THREE.SRGBColorSpace;

        const geometry = new THREE.PlaneGeometry(outerW, outerH);
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.renderOrder = 0;
        this.el.setObject3D("mesh", mesh);
      }
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      touch-action: manipulation;
    }

    video.mindar-video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      display: block !important;
      background: transparent !important;
    }

    canvas.mindar-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
      display: block !important;
      pointer-events: none !important;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2 !important;
      display: block !important;
      background: transparent !important;
    }

    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2 !important;
      display: block !important;
      background: transparent !important;
    }

    .a-enter-vr, .a-enter-ar, .a-orientation-modal, .a-loader-title {
      display: none !important;
    }

    #entry-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #f2e6c9;
    }

    #entry-screen.hidden {
      display: none;
    }

    #entry-sunburst {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220vw;
      height: 220vw;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: repeating-conic-gradient(#e8a62e 0deg 9deg, #c1432e 9deg 18deg);
      opacity: 0.22;
    }

    #entry-title {
      position: relative;
      margin: 0;
      color: #7a2426;
      font-family: "Baloo 2", sans-serif;
      font-size: clamp(48px, 15vw, 72px);
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 0.95;
      text-shadow: 4px 4px 0 #e8a62e, 7px 7px 0 #241a14;
    }

    #entry-subtitle {
      position: relative;
      margin-top: 14px;
      padding: 7px 22px;
      border: 3px solid #241a14;
      border-radius: 999px;
      background: #1b6b67;
      color: #f7efd9;
      font-family: "Fredoka", sans-serif;
      font-size: 16px;
      font-weight: 600;
    }

    #entry-hint {
      position: relative;
      max-width: 300px;
      margin: 26px 0 0;
      color: #241a14;
      font-family: "Fredoka", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.8;
    }

    #entry-btn {
      position: relative;
      margin-top: 22px;
      padding: 14px 38px;
      border: 3px solid #241a14;
      border-radius: 999px;
      background: #e8a62e;
      color: #241a14;
      box-shadow: 4px 4px 0 #241a14;
      font-family: "Fredoka", sans-serif;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    #entry-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 #241a14;
    }

    #scan-hud {
      position: fixed;
      inset: 0;
      z-index: 45;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    #scan-hud.visible {
      opacity: 1;
    }

    #scan-frame {
      position: relative;
      width: 58vw;
      max-width: 320px;
      aspect-ratio: 1 / 1.15;
    }

    #scan-frame .corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border: 4px solid #e8a62e;
      animation: scan-pulse 1.8s ease-in-out infinite;
    }

    @keyframes scan-pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    #scan-frame .tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
    #scan-frame .tr { top: 0; right: 0; border-bottom: none; border-left: none; border-radius: 0 10px 0 0; }
    #scan-frame .bl { bottom: 0; left: 0; border-top: none; border-right: none; border-radius: 0 0 0 10px; }
    #scan-frame .br { right: 0; bottom: 0; border-top: none; border-left: none; border-radius: 0 0 10px 0; }

    #scan-hint {
      position: absolute;
      bottom: -44px;
      left: 50%;
      padding: 6px 16px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.58);
      color: #ffffff;
      font-family: "Fredoka", sans-serif;
      font-size: 14px;
      white-space: nowrap;
    }

    #ar-error-toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      z-index: 110;
      display: none;
      max-width: 86vw;
      padding: 12px 18px;
      border-radius: 14px;
      transform: translateX(-50%);
      background: rgba(20, 10, 8, 0.94);
      color: #f7efd9;
      font-family: "Fredoka", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    #ar-error-toast.visible {
      display: block;
    }

    #ambient-layer {
      position: fixed;
      inset: 0;
      z-index: 44;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e8a62e;
      opacity: 0;
    }

    #loop-gif {
      position: fixed !important;
      top: 18px;
      left: 18px;
      width: 18vw !important;
      max-width: 115px;
      min-width: 62px;
      height: auto !important;
      transform: none;
      z-index: 40;
      pointer-events: none;
      opacity: 0;
      clip-path: circle(0% at 50% 50%);
      border: 3px solid #241a14;
      border-radius: 14px;
      background: #f7efd9;
      box-shadow: 3px 3px 0 #241a14;
    }
  </style>
</head>

<body>
  <div id="entry-screen">
    <div id="entry-sunburst"></div>
    <h1 id="entry-title">MEMEVERSE</h1>
    <div id="entry-subtitle">The Comedy Wall That Talks Back</div>
    <p id="entry-hint">Point your camera at the wall, then tap below to begin. This also enables sound.</p>

      imageTargetSrc: ./targets.mind;
      uiLoading: no;

      uiError: no;

      filterBeta: 0.001;
      autoStart: false;
    "
    color-space="sRGB"
    renderer="
      alpha: true;
      antialias: true;
      colorManagement: true;
      physicallyCorrectLights: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets timeout="1000">

      <video id="video-1" preload="none" loop crossorigin="anonymous" playsinline webkit-playsinline></video>

    <a-camera position="0 0 0" look-controls="enabled: false" active="true" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse"></a-camera>

    <a-entity id="target-0" mindar-image-target="targetIndex: 0">

    <a-entity id="target-9" mindar-image-target="targetIndex: 9">
      <a-entity id="comic-frame-9" comic-frame="innerWidth: 1; innerHeight: 0.55; borderScale: 1.14;" position="0 0 -0.015"></a-entity>
      <a-video id="video-entity-9" class="clickable" src="#video-9" width="1" height="0.55" position="0 0 0" rotation="0 0 0"></a-video>

    <a-entity id="target-10" mindar-image-target="targetIndex: 10">
      <a-entity id="comic-frame-10" comic-frame="innerWidth: 1; innerHeight: 0.55; borderScale: 1.14;" position="0 0 -0.015"></a-entity>
      <a-video id="video-entity-10" class="clickable" src="#video-10" width="1" height="0.55" position="0 0 0" rotation="0 0 0"></a-video>

      <a-entity id="comic-frame-11" comic-frame="innerWidth: 1; innerHeight: 0.55; borderScale: 1.14;" position="0 0 -0.015"></a-entity>
      <a-video id="video-entity-11" class="clickable" src="#video-11" width="1" height="0.55" position="0 0 0" rotation="0 0 0"></a-video>

  <script>
    const sceneEl = document.querySelector("#ar-scene");
    const entryScreen = document.querySelector("#entry-screen");
    const entryBtn = document.querySelector("#entry-btn");
    const scanHud = document.querySelector("#scan-hud");
    const errorToast = document.querySelector("#ar-error-toast");
    const ambientLayer = document.querySelector("#ambient-layer");
    const loopGifEl = document.querySelector("#loop-gif");

    const ROSTER = [
      { index: 0, name: "Brahmanandam", path: "./video/Brahmanandam.mp4" },
      { index: 1, name: "Ali", path: "./video/ali.mp4" },
      { index: 2, name: "Venu Madhav", path: "./video/venumadhav.mp4" },
      { index: 3, name: "Jaya Prakash Reddy", path: "./video/jayaprakesh.mp4" },
      { index: 4, name: "Babu Mohan", path: "./video/babumohan.mp4" },
      { index: 5, name: "Ms Narayana", path: "./video/msnarayana.mp4" },
      { index: 6, name: "Krishna Bhagavan", path: "./video/krishnabagavan.mp4" },
      { index: 7, name: "Sunil", path: "./video/sunil.mp4" },
      { index: 8, name: "Venala Kishore", path: "./video/venalakishor.mp4" },
      { index: 9, name: "Sathya", path: "./video/sathya.mp4" },
      { index: 10, name: "Sapthagiri", path: "./video/Sapthagiri.mp4" },
      { index: 11, name: "Priyadarshi", path: "./video/priyadarshi.mp4" }
    ];

    const targets = ROSTER.map(({ index, name, path }) => ({
      index,
      name,
      path,
      targetEntity: document.querySelector(`#target-${index}`),
      video: document.querySelector(`#video-${index}`),
      frameEntity: document.querySelector(`#comic-frame-${index}`),
      videoEntity: document.querySelector(`#video-entity-${index}`)
    }));

    let hasStartedAR = false;
    let activeIndex = null;
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playTone({ freq = 880, endFreq = null, duration = 0.2, type = "triangle", volume = 0.25 }) {
      const ctx = getAudioCtx();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(freq, ctx.currentTime);

      if (endFreq) {
        oscillator.frequency.exponentialRampToValueAtTime(endFreq, ctx.currentTime + duration * 0.6);
      }

      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

      oscillator.connect(gain);
      gain.connect(ctx.destination);

      oscillator.start();
      oscillator.stop(ctx.currentTime + duration + 0.05);
    }

    function playTapSound() {
      playTone({ freq: 420, endFreq: 620, duration: 0.15, type: "sine", volume: 0.2 });
    }

    function playLockOnChime() {
      playTone({ freq: 700, endFreq: 1100, duration: 0.28, type: "triangle", volume: 0.28 });
    }

    gsap.set("#entry-title, #entry-subtitle, #entry-hint, #entry-btn", { opacity: 0 });
    gsap.set("#entry-title", { scale: 0.7 });

    gsap.to("#entry-sunburst", { rotate: 360, duration: 50, repeat: -1, ease: "none" });

    gsap.timeline()
      .to("#entry-title", { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 0.1)
      .to("#entry-subtitle", { opacity: 1, duration: 0.4 }, 0.4)
      .to("#entry-hint", { opacity: 1, duration: 0.4 }, 0.6)
      .to("#entry-btn", { opacity: 1, duration: 0.4 }, 0.75);

    sceneEl.addEventListener("arReady", () => {
      console.log("MEMEVERSE: MindAR is ready.");
      errorToast.classList.remove("visible");
    });

    sceneEl.addEventListener("arError", (event) => {
      console.error("MEMEVERSE: MindAR camera error:", event.detail);
      errorToast.textContent = "Camera could not start. Allow camera permission and open this site using HTTPS or localhost.";
      errorToast.classList.add("visible");
    });

    entryBtn.addEventListener("click", async () => {
      try {
        const ctx = getAudioCtx();
        if (ctx.state === "suspended") {
          await ctx.resume();
        }
        playTapSound();

        const mindarSystem = sceneEl.systems["mindar-image-system"];
        if (mindarSystem && !hasStartedAR) {
          hasStartedAR = true;
          await mindarSystem.start();
        }

        gsap.to("#entry-screen", {
          opacity: 0,
          scale: 1.05,
          duration: 0.4,
          ease: "power1.in",
          onComplete: () => {
            entryScreen.classList.add("hidden");
            if (activeIndex === null) {
              scanHud.classList.add("visible");
              startAmbientParticles();
            }
          }
        });
      } catch (error) {
        console.error("MEMEVERSE: Start error:", error);
        errorToast.textContent = "Could not open the camera. Please allow camera permission, then reload.";
        errorToast.classList.add("visible");
      }
    });

    function revealSequence(t) {
      if (t.frameEntity && t.frameEntity.object3D) {
        gsap.killTweensOf(t.frameEntity.object3D.scale);
        gsap.fromTo(
          t.frameEntity.object3D.scale,
          { x: 0.001, y: 0.001, z: 0.001 },
          { x: 1, y: 1, z: 1, duration: 0.45, ease: "elastic.out(1, 0.6)" }
        );
      }

      if (t.videoEntity && t.videoEntity.object3D) {
        gsap.killTweensOf(t.videoEntity.object3D.scale);
        gsap.fromTo(
          t.videoEntity.object3D.scale,
          { x: 0.001, y: 0.001, z: 0.001 },
          { x: 1, y: 1, z: 1, delay: 0.1, duration: 0.45, ease: "elastic.out(1, 0.6)" }
        );
      }

      gsap.delayedCall(0.22, () => {
        if (activeIndex === t.index) {
          startGifLoop(t.index);
        }
      });
    }

    function hideSequence(t) {
      if (t.frameEntity && t.frameEntity.object3D) {
        gsap.killTweensOf(t.frameEntity.object3D.scale);
        gsap.to(t.frameEntity.object3D.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 0.2, ease: "power1.in" });
      }

      if (t.videoEntity && t.videoEntity.object3D) {
        gsap.killTweensOf(t.videoEntity.object3D.scale);
        gsap.to(t.videoEntity.object3D.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 0.2, ease: "power1.in" });
      }

      stopGifLoop();
    }

    targets.forEach((t) => {
      if (!t.targetEntity) return;

      t.targetEntity.addEventListener("targetFound", async () => {
        if (activeIndex !== null && activeIndex !== t.index) return;

        activeIndex = t.index;
        scanHud.classList.remove("visible");
        stopAmbientParticles();

        if (t.video) {
          if (!t.video.getAttribute("src")) {
            t.video.setAttribute("src", t.path);
            t.video.load();
          }
          t.video.currentTime = 0;
          try {
            await t.video.play();
          } catch (error) {
            console.warn(`MEMEVERSE: Playback blocked for "${t.name}":`, error);
          }
        }

        playLockOnChime();
        revealSequence(t);
      });

      t.targetEntity.addEventListener("targetLost", () => {
        if (activeIndex !== t.index) return;

        activeIndex = null;

        if (t.video) {
          t.video.pause();
        }

        hideSequence(t);

        if (entryScreen.classList.contains("hidden")) {
          scanHud.classList.add("visible");
          startAmbientParticles();
        }
      });
    });

    const DEFAULT_GIFS = ["Gifs/1.gif", "Gifs/2.gif", "Gifs/3.gif", "Gifs/4.gif", "Gifs/5.gif", "Gifs/6.gif", "Gifs/7.gif"];
    const GIF_SETS = {};
    targets.forEach((t) => { GIF_SETS[t.index] = DEFAULT_GIFS; });

    const GIF_FRAME_MS = 500;
    let gifTimer = null;
    let gifIndex = 0;
    const irisProxy = { r: 0 };

    loopGifEl.addEventListener("error", () => {
      gsap.killTweensOf(irisProxy);
      irisProxy.r = 0;
      loopGifEl.style.opacity = "0";
      loopGifEl.style.clipPath = "circle(0% at 50% 50%)";
    });

    function showNextGifFrame(gifList) {
      if (!gifList || gifList.length === 0) return;

      const source = gifList[gifIndex % gifList.length];
      gifIndex += 1;

      loopGifEl.src = source;
      loopGifEl.style.opacity = "1";

      gsap.killTweensOf(irisProxy);
      irisProxy.r = 0;

      gsap.to(irisProxy, {
        r: 75,
        duration: 0.3,
        ease: "power2.out",
        onUpdate: () => {
          loopGifEl.style.clipPath = `circle(${irisProxy.r}% at 50% 50%)`;
        }
      });
    }

    function startGifLoop(index) {
      const gifList = GIF_SETS[index];
      if (!gifList || gifList.length === 0) return;

      stopGifLoop();
      gifIndex = 0;
      showNextGifFrame(gifList);

      gifTimer = window.setInterval(() => {
        if (activeIndex === index) {
          showNextGifFrame(gifList);
        }
      }, GIF_FRAME_MS);
    }

    function stopGifLoop() {
      if (gifTimer) {
        window.clearInterval(gifTimer);
        gifTimer = null;
      }

      gsap.killTweensOf(irisProxy);
      gsap.to(irisProxy, {
        r: 0,
        duration: 0.2,
        ease: "power1.in",
        onUpdate: () => {
          loopGifEl.style.clipPath = `circle(${irisProxy.r}% at 50% 50%)`;
        },
        onComplete: () => {
          loopGifEl.style.opacity = "0";
        }
      });
    }

    let ambientTimer = null;

    function spawnAmbientDot() {
      const dot = document.createElement("div");
      dot.className = "ambient-dot";

      const x = window.innerWidth * (0.3 + Math.random() * 0.4);
      const startY = window.innerHeight * 0.75;

      dot.style.left = `${x}px`;
      dot.style.top = `${startY}px`;

      ambientLayer.appendChild(dot);

      gsap.timeline({ onComplete: () => dot.remove() })
        .to(dot, { opacity: 0.6, duration: 0.4 }, 0)
        .to(dot, { y: -180 - Math.random() * 100, x: `+=${(Math.random() - 0.5) * 60}`, duration: 2.4, ease: "power1.out" }, 0)
        .to(dot, { opacity: 0, duration: 0.5 }, 1.9);
    }

    function startAmbientParticles() {
      if (ambientTimer) return;
      spawnAmbientDot();
      ambientTimer = window.setInterval(() => spawnAmbientDot(), 700);
    }

    function stopAmbientParticles() {
      if (ambientTimer) {
        window.clearInterval(ambientTimer);
        ambientTimer = null;
      }
    }

    sceneEl.addEventListener("loaded", () => {
      targets.forEach((t) => {
        if (t.frameEntity && t.frameEntity.object3D) {
          t.frameEntity.object3D.scale.set(0.001, 0.001, 0.001);
        }
        if (t.videoEntity && t.videoEntity.object3D) {
          t.videoEntity.object3D.scale.set(0.001, 0.001, 0.001);
        }
      });
    });
  </script>
</body>
</html>
