<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>MEMEVERSE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <script>
    AFRAME.registerComponent("comic-frame", {
      schema: {
        innerWidth: { type: "number", default: 1 },
        innerHeight: { type: "number", default: 0.55 },
        borderScale: { type: "number", default: 1.14 }
      },

      init: function () {
        const THREE = AFRAME.THREE;
        const { innerWidth, innerHeight, borderScale } = this.data;

        const outerW = innerWidth * borderScale;
        const outerH = innerHeight * borderScale;

        const canvas = document.createElement("canvas");
        canvas.width = 1024;
        canvas.height = Math.round(1024 * (outerH / outerW));

        const ctx = canvas.getContext("2d");

        const marginFrac = (borderScale - 1) / (2 * borderScale);
        const mx = canvas.width * marginFrac;
        const my = canvas.height * marginFrac;

        const outerRadius = canvas.width * 0.035;
        const innerRadius = canvas.width * 0.018;

        function roundedRectPath(x, y, w, h, radius) {
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.arcTo(x + w, y, x + w, y + h, radius);
          ctx.arcTo(x + w, y + h, x, y + h, radius);
          ctx.arcTo(x, y + h, x, y, radius);
          ctx.arcTo(x, y, x + w, y, radius);
          ctx.closePath();
        }

        ctx.save();
        ctx.shadowColor = "rgba(36, 26, 20, 0.35)";
        ctx.shadowBlur = canvas.width * 0.025;
        ctx.shadowOffsetY = canvas.width * 0.012;

        roundedRectPath(0, 0, canvas.width, canvas.height, outerRadius);
        ctx.fillStyle = "#F7EFD9";
        ctx.fill();
        ctx.restore();

        roundedRectPath(0, 0, canvas.width, canvas.height, outerRadius);
        ctx.lineWidth = canvas.width * 0.014;
        ctx.strokeStyle = "#241A14";
        ctx.stroke();

        ctx.save();
        ctx.globalCompositeOperation = "destination-out";
        roundedRectPath(mx, my, canvas.width - mx * 2, canvas.height - my * 2, innerRadius);
        ctx.fill();
        ctx.restore();

        roundedRectPath(mx, my, canvas.width - mx * 2, canvas.height - my * 2, innerRadius);
        ctx.lineWidth = canvas.width * 0.009;
        ctx.strokeStyle = "#241A14";
        ctx.stroke();

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        texture.colorSpace = THREE.SRGBColorSpace;

        const geometry = new THREE.PlaneGeometry(outerW, outerH);
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.renderOrder = 0;
        this.el.setObject3D("mesh", mesh);
      }
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      touch-action: manipulation;
    }

    video.mindar-video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      display: block !important;
      background: transparent !important;
    }

    canvas.mindar-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
      display: block !important;
      pointer-events: none !important;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2 !important;
      display: block !important;
      background: transparent !important;
    }

    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2 !important;
      display: block !important;
      background: transparent !important;
    }

    .a-enter-vr, .a-enter-ar, .a-orientation-modal, .a-loader-title {
      display: none !important;
    }

    #entry-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #f2e6c9;
    }

    #entry-screen.hidden {
      display: none;
    }

    #entry-sunburst {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220vw;
      height: 220vw;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: repeating-conic-gradient(#e8a62e 0deg 9deg, #c1432e 9deg 18deg);
      opacity: 0.22;
    }

    #entry-title {
      position: relative;
      margin: 0;
      color: #7a2426;
      font-family: "Baloo 2", sans-serif;
      font-size: clamp(48px, 15vw, 72px);
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 0.95;
      text-shadow: 4px 4px 0 #e8a62e, 7px 7px 0 #241a14;
    }

    #entry-subtitle {
      position: relative;
      margin-top: 14px;
      padding: 7px 22px;
      border: 3px solid #241a14;
      border-radius: 999px;
      background: #1b6b67;
      color: #f7efd9;
      font-family: "Fredoka", sans-serif;
      font-size: 16px;
      font-weight: 600;
    }

    #entry-hint {
      position: relative;
      max-width: 300px;
      margin: 26px 0 0;
      color: #241a14;
      font-family: "Fredoka", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.8;
    }

    #entry-btn {
      position: relative;
      margin-top: 22px;
      padding: 14px 38px;
      border: 3px solid #241a14;
      border-radius: 999px;
      background: #e8a62e;
      color: #241a14;
      box-shadow: 4px 4px 0 #241a14;
      font-family: "Fredoka", sans-serif;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    #entry-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 #241a14;
    }

    #scan-hud {
      position: fixed;
      inset: 0;
      z-index: 45;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    #scan-hud.visible {
      opacity: 1;
    }

    #scan-frame {
      position: relative;
      width: 58vw;
      max-width: 320px;
      aspect-ratio: 1 / 1.15;
    }

    #scan-frame .corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border: 4px solid #e8a62e;
      animation: scan-pulse 1.8s ease-in-out infinite;
    }

    @keyframes scan-pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    #scan-frame .tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
    #scan-frame .tr { top: 0; right: 0; border-bottom: none; border-left: none; border-radius: 0 10px 0 0; }
    #scan-frame .bl { bottom: 0; left: 0; border-top: none; border-right: none; border-radius: 0 0 0 10px; }
    #scan-frame .br { right: 0; bottom: 0; border-top: none; border-left: none; border-radius: 0 0 10px 0; }

    #scan-hint {
      position: absolute;
      bottom: -44px;
      left: 50%;
      padding: 6px 16px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.58);
      color: #ffffff;
      font-family: "Fredoka", sans-serif;
      font-size: 14px;
      white-space: nowrap;
    }

    #ar-error-toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      z-index: 110;
      display: none;
      max-width: 86vw;
      padding: 12px 18px;
      border-radius: 14px;
      transform: translateX(-50%);
      background: rgba(20, 10, 8, 0.94);
      color: #f7efd9;
      font-family: "Fredoka", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    #ar-error-toast.visible {
      display: block;
    }

    #ambient-layer {
      position: fixed;
      inset: 0;
      z-index: 44;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e8a62e;
      opacity: 0;
    }

    #loop-gif {
      position: fixed !important;
      top: 18px;
      left: 18px;
      width: 18vw !important;
      max-width: 115px;
      min-width: 62px;
      height: auto !important;
      transform: none;
      z-index: 40;
      pointer-events: none;
      opacity: 0;
      clip-path: circle(0% at 50% 50%);
      border: 3px solid #241a14;
      border-radius: 14px;
      background: #f7efd9;
      box-shadow: 3px 3px 0 #241a14;
    }

    /* -------- Bottom Right Watermark & Sound Container -------- */
    #bottom-right-container {
      position: fixed;
      right: 16px;
      bottom: 14px;
      z-index: 42;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }

    #brand-watermark {
      background: transparent;
      color: #F7EFD9;
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.4px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.65), 0 0 8px rgba(0,0,0,0.35);
      white-space: nowrap;
    }

    /* Animated Sound Toggle Button */
    #audio-toggle-btn {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 2px solid #241A14;
      border-radius: 999px;
      background: #e8a62e;
      color: #241A14;
      font-family: "Fredoka", sans-serif;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 2px 2px 0 #241A14;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    #audio-toggle-btn:active {
      transform: scale(0.94);
    }

    #audio-toggle-btn.muted {
      background: #c1432e;
      color: #F7EFD9;
    }

    .audio-waves {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }

    .audio-wave-bar {
      width: 3px;
      height: 100%;
      background-color: currentColor;
      border-radius: 2px;
    }

    #audio-toggle-btn.playing .bar1 { animation: sound-wave 0.6s ease-in-out infinite alternate; }
    #audio-toggle-btn.playing .bar2 { animation: sound-wave 0.8s ease-in-out 0.2s infinite alternate; }
    #audio-toggle-btn.playing .bar3 { animation: sound-wave 0.5s ease-in-out 0.4s infinite alternate; }

    #audio-toggle-btn.muted .audio-wave-bar {
      height: 3px !important;
      animation: none !important;
    }

    @keyframes sound-wave {
      0% { height: 20%; }
      100% { height: 100%; }
    }
  </style>
</head>

<body>
  <div id="entry-screen">
    <div id="entry-sunburst"></div>
    <h1 id="entry-title">MEMEVERSE</h1>
    <div id="entry-subtitle">The Comedy Wall That Talks Back</div>
    <p id="entry-hint">Point your camera at the wall, then tap below to begin. This also enables sound.</p>
    <button id="entry-btn" type="button">Tap to Begin</button>
  </div>

  <div id="scan-hud">
    <div id="scan-frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>

      <div id="scan-hint">Point at a face on the wall</div>

  <div id="ambient-layer"></div>
  <div id="ar-error-toast"></div>
  <img id="loop-gif" src="" alt="" />
  
  <div id="bottom-right-container">

      <div class="audio-waves">
        <div class="audio-wave-bar bar1"></div>
        <div class="audio-wave-bar bar2"></div>
        <div class="audio-wave-bar bar3"></div>

  <script>
    const sceneEl = document.querySelector("#ar-scene");
    const entryScreen = document.querySelector("#entry-screen");
    const entryBtn = document.querySelector("#entry-btn");
    const scanHud = document.querySelector("#scan-hud");
    const errorToast = document.querySelector("#ar-error-toast");
    const ambientLayer = document.querySelector("#ambient-layer");
    const loopGifEl = document.querySelector("#loop-gif");
    const audioToggleBtn = document.querySelector("#audio-toggle-btn");
    const audioBtnText = document.querySelector("#audio-btn-text");

    const ROSTER = [
      { index: 0, name: "Brahmanandam", path: "./video/Brahmanandam.mp4" },
      { index: 1, name: "Ali", path: "./video/ali.mp4" },
      { index: 2, name: "Venu Madhav", path: "./video/venumadhav.mp4" },
      { index: 3, name: "Jaya Prakash Reddy", path: "./video/jayaprakesh.mp4" },
      { index: 4, name: "Babu Mohan", path: "./video/babumohan.mp4" },
      { index: 5, name: "Ms Narayana", path: "./video/msnarayana.mp4" },
      { index: 6, name: "Krishna Bhagavan", path: "./video/krishnabagavan.mp4" },
      { index: 7, name: "Sunil", path: "./video/sunil.mp4" },
      { index: 8, name: "Venala Kishore", path: "./video/venalakishor.mp4" },
      { index: 9, name: "Sathya", path: "./video/sathya.mp4" },
      { index: 10, name: "Sapthagiri", path: "./video/Sapthagiri.mp4" },
      { index: 11, name: "Priyadarshi", path: "./video/priyadarshi.mp4" }
    ];

    const targets = ROSTER.map(({ index, name, path }) => ({
      index,
      name,
      path,
      targetEntity: document.querySelector(`#target-${index}`),
      video: document.querySelector(`#video-${index}`),
      frameEntity: document.querySelector(`#comic-frame-${index}`),
      videoEntity: document.querySelector(`#video-entity-${index}`)
    }));

    let hasStartedAR = false;
    let activeIndex = null;
    let audioCtx = null;
