    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <script>
    AFRAME.registerComponent("comic-frame", {
      schema: {
        innerWidth: { type: "number", default: 1 },
        innerHeight: { type: "number", default: 0.55 },
        borderScale: { type: "number", default: 1.14 }
      },

      init: function () {
        const THREE = AFRAME.THREE;
        const { innerWidth, innerHeight, borderScale } = this.data;

        const outerW = innerWidth * borderScale;
        const outerH = innerHeight * borderScale;

        const canvas = document.createElement("canvas");
        canvas.width = 1024;
        canvas.height = Math.round(1024 * (outerH / outerW));

        const ctx = canvas.getContext("2d");

        const marginFrac = (borderScale - 1) / (2 * borderScale);
        const mx = canvas.width * marginFrac;
        const my = canvas.height * marginFrac;

        const outerRadius = canvas.width * 0.035;
        const innerRadius = canvas.width * 0.018;

        function roundedRectPath(x, y, w, h, radius) {
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.arcTo(x + w, y, x + w, y + h, radius);
          ctx.arcTo(x + w, y + h, x, y + h, radius);
          ctx.arcTo(x, y + h, x, y, radius);
          ctx.arcTo(x, y, x + w, y, radius);
          ctx.closePath();
        }

        /* Cream outer card with soft shadow */
        ctx.save();
        ctx.shadowColor = "rgba(36, 26, 20, 0.35)";
        ctx.shadowBlur = canvas.width * 0.025;
        ctx.shadowOffsetY = canvas.width * 0.012;

        roundedRectPath(
          0,
          0,
          canvas.width,
          canvas.height,
          outerRadius
        );

        ctx.fillStyle = "#F7EFD9";
        ctx.fill();
        ctx.restore();

        /* Outer black outline */
        roundedRectPath(
          0,
          0,
          canvas.width,
          canvas.height,
          outerRadius
        );

        ctx.lineWidth = canvas.width * 0.014;
        ctx.strokeStyle = "#241A14";
        ctx.stroke();

        /* Transparent video cutout */
        ctx.save();
        ctx.globalCompositeOperation = "destination-out";

        roundedRectPath(
          mx,
          my,
          canvas.width - mx * 2,
          canvas.height - my * 2,
          innerRadius
        );

        ctx.fill();
        ctx.restore();

        /* Inner black outline */
        roundedRectPath(
          mx,
          my,
          canvas.width - mx * 2,
          canvas.height - my * 2,
          innerRadius
        );

        ctx.lineWidth = canvas.width * 0.009;
        ctx.strokeStyle = "#241A14";
        ctx.stroke();

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        texture.colorSpace = THREE.SRGBColorSpace;

        const geometry = new THREE.PlaneGeometry(outerW, outerH);

        const material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide
        });

        const mesh = new THREE.Mesh(geometry, material);

        mesh.renderOrder = 0;

        this.el.setObject3D("mesh", mesh);
      }
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      touch-action: manipulation;
    }

    /*
      MindAR dynamically creates its own camera video and tracking canvas.
      These styles keep them full-screen and behind the AR scene.
    */
    video.mindar-video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      display: block !important;
      background: transparent !important;
    }

    canvas.mindar-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
      display: block !important;
      pointer-events: none !important;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2 !important;
      display: block !important;
      background: transparent !important;
    }

    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2 !important;
      display: block !important;
      background: transparent !important;
    }

    .a-enter-vr,
    .a-enter-ar,
    .a-orientation-modal,
    .a-loader-title {
      display: none !important;
    }

    /* ------------------------------------------------------------- */
    /* Entry screen                                                  */
    /* ------------------------------------------------------------- */

    #entry-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #f2e6c9;
    }

    #entry-screen.hidden {
      display: none;
    }

    #entry-sunburst {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220vw;
      height: 220vw;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: repeating-conic-gradient(
        #e8a62e 0deg 9deg,
        #c1432e 9deg 18deg
      );
      opacity: 0.22;
    }

    #entry-title {
      position: relative;
      margin: 0;
      color: #7a2426;
      font-family: "Baloo 2", sans-serif;
      font-size: clamp(48px, 15vw, 72px);
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 0.95;
      text-shadow:
        4px 4px 0 #e8a62e,
        7px 7px 0 #241a14;
    }

    #entry-subtitle {
      position: relative;
      margin-top: 14px;
      padding: 7px 22px;
      border: 3px solid #241a14;
      border-radius: 999px;
      background: #1b6b67;
      color: #f7efd9;
      font-family: "Fredoka", sans-serif;
      font-size: 16px;
      font-weight: 600;
    }

    #entry-hint {
      position: relative;
      max-width: 300px;
      margin: 26px 0 0;
      color: #241a14;
      font-family: "Fredoka", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.8;
    }

    #entry-btn {
      position: relative;
      margin-top: 22px;
      padding: 14px 38px;
      border: 3px solid #241a14;
      border-radius: 999px;
      background: #e8a62e;
      color: #241a14;
      box-shadow: 4px 4px 0 #241a14;
      font-family: "Fredoka", sans-serif;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    #entry-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 #241a14;
    }

    /* ------------------------------------------------------------- */
    /* Scan HUD                                                      */
    /* ------------------------------------------------------------- */

    #scan-hud {
      position: fixed;
      inset: 0;
      z-index: 45;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    #scan-hud.visible {
      opacity: 1;
    }

    #scan-frame {
      position: relative;
      width: 58vw;
      max-width: 320px;
      aspect-ratio: 1 / 1.15;
    }

    #scan-frame .corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border: 4px solid #e8a62e;
      animation: scan-pulse 1.8s ease-in-out infinite;
    }

    @keyframes scan-pulse {
      0%,
      100% {
        opacity: 0.55;
      }

      50% {
        opacity: 1;
      }
    }

    #scan-frame .tl {
      top: 0;
      left: 0;
      border-right: none;
      border-bottom: none;
      border-radius: 10px 0 0 0;
    }

    #scan-frame .tr {
      top: 0;
      right: 0;
      border-bottom: none;
      border-left: none;
      border-radius: 0 10px 0 0;
    }

    #scan-frame .bl {
      bottom: 0;
      left: 0;
      border-top: none;
      border-right: none;
      border-radius: 0 0 0 10px;
    }

    #scan-frame .br {
      right: 0;
      bottom: 0;
      border-top: none;
      border-left: none;
      border-radius: 0 0 10px 0;
    }

    #scan-hint {
      position: absolute;
      bottom: -44px;
      left: 50%;
      padding: 6px 16px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.58);
      color: #ffffff;
      font-family: "Fredoka", sans-serif;
      font-size: 14px;
      white-space: nowrap;
    }

    /* ------------------------------------------------------------- */
    /* Error toast                                                   */
    /* ------------------------------------------------------------- */

    #ar-error-toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      z-index: 110;
      display: none;
      max-width: 86vw;
      padding: 12px 18px;
      border-radius: 14px;
      transform: translateX(-50%);
      background: rgba(20, 10, 8, 0.94);
      color: #f7efd9;
      font-family: "Fredoka", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    #ar-error-toast.visible {
      display: block;
    }

    /* ------------------------------------------------------------- */
    /* Ambient scan particles                                        */
    /* ------------------------------------------------------------- */

    #ambient-layer {
      position: fixed;
      inset: 0;
      z-index: 44;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e8a62e;
      opacity: 0;
    }

    /* ------------------------------------------------------------- */
    /* GIF overlay                                                   */
    /* ------------------------------------------------------------- */

    #loop-gif {
      position: fixed !important;
      top: 50%;
      left: 50%;
      z-index: 40;
      width: 42vw !important;
      max-width: 320px;
      height: auto !important;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      clip-path: circle(0% at 50% 50%);
    }
  </style>
</head>

    const sceneEl = document.querySelector("#ar-scene");

    const entryScreen = document.querySelector("#entry-screen");
    const entryBtn = document.querySelector("#entry-btn");

    const scanHud = document.querySelector("#scan-hud");
    const errorToast = document.querySelector("#ar-error-toast");

    const loopGifEl = document.querySelector("#loop-gif");

    // One entry per comedian. Edit content.json-style config in ROSTER
    // below to add/rename/swap comedians -- everything else (listeners,
    // reveal animation, gif loop) is driven off this array.
    const ROSTER = [
      { index: 0, name: "Brahmanandam" },
      { index: 1, name: "Ali" },
      { index: 2, name: "Venu Madhav" },
      { index: 3, name: "Jaya Prakash Reddy" },
      { index: 4, name: "Babu Mohan" },
      { index: 5, name: "Ms Narayana" },
      { index: 6, name: "Krishna Bhagavan" },
      { index: 7, name: "Sunil" },
      { index: 8, name: "Venala Kishore" },
      { index: 9, name: "Sathya" },
      { index: 10, name: "Sapthagiri" },
      { index: 11, name: "Priyadarshi" }
    ];

    const targets = ROSTER.map(({ index, name }) => ({
      index,
      name,
      targetEntity: document.querySelector(`#target-${index}`),
      video: document.querySelector(`#video-${index}`),
      frameEntity: document.querySelector(`#comic-frame-${index}`),
      videoEntity: document.querySelector(`#video-entity-${index}`)
    }));

    let hasStartedAR = false;
    let activeIndex = null; // which comedian (if any) is currently locked on

    /* ------------------------------------------------------------- */
    /* Web Audio UI sounds                                           */
    /* ------------------------------------------------------------- */

    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (
          window.AudioContext ||
          window.webkitAudioContext
        )();
      }

      return audioCtx;
    }

    function playTone({
      freq = 880,
      endFreq = null,
      duration = 0.2,
      type = "triangle",
      volume = 0.25
    }) {
      const ctx = getAudioCtx();

      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(
        freq,
        ctx.currentTime
      );

      if (endFreq) {
        oscillator.frequency.exponentialRampToValueAtTime(
          endFreq,
          ctx.currentTime + duration * 0.6
        );
      }

      gain.gain.setValueAtTime(
        0.0001,
        ctx.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        volume,
        ctx.currentTime + 0.02
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        ctx.currentTime + duration
      );

      oscillator.connect(gain);
      gain.connect(ctx.destination);

      oscillator.start();
      oscillator.stop(ctx.currentTime + duration + 0.05);
    }

    function playTapSound() {
      playTone({
        freq: 420,
        endFreq: 620,
        duration: 0.15,
        type: "sine",
        volume: 0.2
      });
    }

    function playLockOnChime() {
      playTone({
        freq: 700,
        endFreq: 1100,
        duration: 0.28,
        type: "triangle",
        volume: 0.28
      });
    }

    /* ------------------------------------------------------------- */
    /* Entry screen animation                                        */
    /* ------------------------------------------------------------- */

    gsap.set(
      "#entry-title, #entry-subtitle, #entry-hint, #entry-btn",
      { opacity: 0 }
    );

    gsap.set("#entry-title", {
      scale: 0.7
    });

    gsap.to("#entry-sunburst", {
      rotate: 360,
      duration: 50,
      repeat: -1,
      ease: "none"
    });

    gsap.timeline()
      .to(
        "#entry-title",
        {
          opacity: 1,
          scale: 1,
          duration: 0.6,
          ease: "back.out(1.6)"
        },
        0.1
      )
      .to(
        "#entry-subtitle",
        {
          opacity: 1,
          duration: 0.4
        },
        0.4
      )
      .to(
        "#entry-hint",
        {
          opacity: 1,
          duration: 0.4
        },
        0.6
      )
      .to(
        "#entry-btn",
        {
          opacity: 1,
          duration: 0.4
        },
        0.75
      );

    /* ------------------------------------------------------------- */
    /* MindAR events                                                 */
    /* ------------------------------------------------------------- */

    sceneEl.addEventListener("arReady", () => {
      console.log("MEMEVERSE: MindAR is ready.");
      errorToast.classList.remove("visible");
    });

    sceneEl.addEventListener("arError", (event) => {
      console.error("MEMEVERSE: MindAR camera error:", event.detail);

      errorToast.textContent =
        "Camera could not start. Allow camera permission and open this site using HTTPS or localhost.";

      errorToast.classList.add("visible");
    });

    /* ------------------------------------------------------------- */
    /* Start AR after the user gesture                               */
    /* ------------------------------------------------------------- */

    entryBtn.addEventListener("click", async () => {
      try {
        const ctx = getAudioCtx();

        if (ctx.state === "suspended") {
          await ctx.resume();
        }

        playTapSound();

        /*
          Unlock audio permission for ALL 12 comedian clips at once.
          Each briefly "plays" (silently, still muted=false but paused
          again immediately) during this one tap -- browsers count each
          successful play() as that element being user-activated, so
          later play() calls from targetFound are allowed to have sound
          too, without needing a fresh tap per comedian.
        */
        for (const t of targets) {
          if (!t.video) continue;
          t.video.muted = false;
          try {
            await t.video.play();
            t.video.pause();
            t.video.currentTime = 0;
          } catch (videoError) {
            console.warn(
              `MEMEVERSE: Audio unlock blocked for "${t.name}", will retry on target found.`,
              videoError
            );
          }
        }

        /*
          MindAR normally begins automatically after scene initialization.
          This starts it only if it has not begun yet.
        */
        const mindarSystem = sceneEl.systems["mindar-image-system"];

        if (
          mindarSystem &&
          !hasStartedAR
        ) {
          hasStartedAR = true;

          try {
            await mindarSystem.start();
          } catch (startError) {
            console.warn(
              "MEMEVERSE: MindAR may already be running.",
              startError
            );
          }
        }

        gsap.to("#entry-screen", {
          opacity: 0,
          scale: 1.05,
          duration: 0.4,
          ease: "power1.in",

          onComplete: () => {
            entryScreen.classList.add("hidden");

            if (activeIndex === null) {
              scanHud.classList.add("visible");
              startAmbientParticles();
            }
          }
        });
      } catch (error) {
        console.error("MEMEVERSE: Start error:", error);

        errorToast.textContent =
          "Could not open the camera. Please allow camera permission, then reload.";

        errorToast.classList.add("visible");
      }
    });

    /* ------------------------------------------------------------- */
    /* Target reveal and hide animation                              */
    /* ------------------------------------------------------------- */

    function revealSequence(t) {
      if (t.frameEntity && t.frameEntity.object3D) {
        gsap.killTweensOf(t.frameEntity.object3D.scale);

        gsap.fromTo(
          t.frameEntity.object3D.scale,
          {
            x: 0.001,
            y: 0.001,
            z: 0.001
          },
          {
            x: 1,
            y: 1,
            z: 1,
            duration: 0.45,
            ease: "elastic.out(1, 0.6)"
          }
        );
      }

      if (t.videoEntity && t.videoEntity.object3D) {
        gsap.killTweensOf(t.videoEntity.object3D.scale);

        gsap.fromTo(
          t.videoEntity.object3D.scale,
          {
            x: 0.001,
            y: 0.001,
            z: 0.001
          },
          {
            x: 1,
            y: 1,
            z: 1,
            delay: 0.1,
            duration: 0.45,
            ease: "elastic.out(1, 0.6)"
          }
        );
      }

      gsap.delayedCall(0.22, () => {
        if (activeIndex === t.index) {
          startGifLoop(t.index);
        }
      });
    }

    function hideSequence(t) {
      if (t.frameEntity && t.frameEntity.object3D) {
        gsap.killTweensOf(t.frameEntity.object3D.scale);

        gsap.to(t.frameEntity.object3D.scale, {
          x: 0.001,
          y: 0.001,
          z: 0.001,
          duration: 0.2,
          ease: "power1.in"
        });
      }

      if (t.videoEntity && t.videoEntity.object3D) {
        gsap.killTweensOf(t.videoEntity.object3D.scale);

        gsap.to(t.videoEntity.object3D.scale, {
          x: 0.001,
          y: 0.001,
          z: 0.001,
          duration: 0.2,
          ease: "power1.in"
        });
      }

      stopGifLoop();
    }

    // One pair of listeners per comedian. Only ONE comedian is treated as
    // "active" at a time (activeIndex) -- if two targets were somehow
    // found in the same frame (unlikely on a single wall photo, but
    // possible with a wide-angle lens catching two faces), the first one
    // found wins and a second targetFound is ignored until the first is
    // lost. This avoids two videos/sounds firing simultaneously.
    targets.forEach((t) => {
      if (!t.targetEntity) {
        console.warn(`MEMEVERSE: missing #target-${t.index} in the DOM (${t.name}) - check the HTML.`);
        return;
      }

      t.targetEntity.addEventListener("targetFound", async () => {
        if (activeIndex !== null && activeIndex !== t.index) {
          return; // another comedian is already active - ignore
        }

        console.log(`MEMEVERSE: Target found - ${t.name} (index ${t.index}).`);

        activeIndex = t.index;

        scanHud.classList.remove("visible");
        stopAmbientParticles();

        if (t.video) {
          t.video.currentTime = 0;
          try {
            await t.video.play();
          } catch (error) {
            console.warn(`MEMEVERSE: Playback blocked for "${t.name}":`, error);
          }
        }

        playLockOnChime();
        revealSequence(t);
      });

      t.targetEntity.addEventListener("targetLost", () => {
        if (activeIndex !== t.index) return; // wasn't the active one - ignore

        console.log(`MEMEVERSE: Target lost - ${t.name} (index ${t.index}).`);

        activeIndex = null;

        if (t.video) t.video.pause();

        hideSequence(t);

        if (entryScreen.classList.contains("hidden")) {
          scanHud.classList.add("visible");
          startAmbientParticles();
        }
      });
    });

    /* ------------------------------------------------------------- */
    /* GIF loop                                                      */
    /* ------------------------------------------------------------- */

    // Default GIF set shared by every comedian unless overridden below.
    // To give a specific comedian their own GIFs, add/replace that
    // targetIndex's array, e.g. GIF_SETS[3] = ["Gifs/special-1.GIF", ...].
    const DEFAULT_GIFS = [
      "Gifs/1.GIF",
      "Gifs/2.GIF",
      "Gifs/3.GIF",
      "Gifs/4.GIF",
      "Gifs/5.GIF",
      "Gifs/6.GIF",
      "Gifs/7.GIF"
    ];

    const GIF_SETS = {};
    targets.forEach((t) => {
      GIF_SETS[t.index] = DEFAULT_GIFS;
    });

    const GIF_FRAME_MS = 500;

    let gifTimer = null;
    let gifIndex = 0;

    const irisProxy = {
      r: 0
    };

    loopGifEl.addEventListener("error", () => {
      console.warn(
        `MEMEVERSE: GIF failed to load: ${loopGifEl.src}`
      );

      gsap.killTweensOf(irisProxy);

      irisProxy.r = 0;

      loopGifEl.style.opacity = "0";
      loopGifEl.style.clipPath =
        "circle(0% at 50% 50%)";
    });

    function showNextGifFrame(gifList) {
      if (!gifList || gifList.length === 0) {
        return;
      }

      const source = gifList[gifIndex % gifList.length];

      gifIndex += 1;

      loopGifEl.src = source;
      loopGifEl.style.opacity = "1";

      gsap.killTweensOf(irisProxy);

      irisProxy.r = 0;

      gsap.to(irisProxy, {
        r: 75,
        duration: 0.3,
        ease: "power2.out",

        onUpdate: () => {
          loopGifEl.style.clipPath =
            `circle(${irisProxy.r}% at 50% 50%)`;
        }
      });
    }

    function startGifLoop(index) {
      const gifList = GIF_SETS[index];

      if (!gifList || gifList.length === 0) {
        return;
      }

      stopGifLoop();

      gifIndex = 0;

      showNextGifFrame(gifList);

      gifTimer = window.setInterval(() => {
        if (activeIndex === index) {
          showNextGifFrame(gifList);
        }
      }, GIF_FRAME_MS);
    }

    function stopGifLoop() {
      if (gifTimer) {
        window.clearInterval(gifTimer);
        gifTimer = null;
      }

      gsap.killTweensOf(irisProxy);

      gsap.to(irisProxy, {
        r: 0,
        duration: 0.2,
        ease: "power1.in",

        onUpdate: () => {
          loopGifEl.style.clipPath =
            `circle(${irisProxy.r}% at 50% 50%)`;
        },

        onComplete: () => {
          loopGifEl.style.opacity = "0";
        }
      });
    }

    /* ------------------------------------------------------------- */
    /* Ambient particles                                             */
    /* ------------------------------------------------------------- */

    let ambientTimer = null;

    function spawnAmbientDot() {
      const dot = document.createElement("div");

      dot.className = "ambient-dot";

      const x =
        window.innerWidth *
        (0.3 + Math.random() * 0.4);

      const startY = window.innerHeight * 0.75;

      dot.style.left = `${x}px`;
      dot.style.top = `${startY}px`;

      ambientLayer.appendChild(dot);

      gsap.timeline({
        onComplete: () => {
          dot.remove();
        }
      })
        .to(
          dot,
          {
            opacity: 0.6,
            duration: 0.4
          },
          0
        )
        .to(
          dot,
          {
            y: -180 - Math.random() * 100,
            x: `+=${(Math.random() - 0.5) * 60}`,
            duration: 2.4,
            ease: "power1.out"
          },
          0
        )
        .to(
          dot,
          {
            opacity: 0,
            duration: 0.5
          },
          1.9
        );
    }

    function startAmbientParticles() {
      if (ambientTimer) {
        return;
      }

      spawnAmbientDot();

      ambientTimer = window.setInterval(() => {
        spawnAmbientDot();
      }, 700);
    }

    function stopAmbientParticles() {
      if (ambientTimer) {
        window.clearInterval(ambientTimer);
        ambientTimer = null;
      }
    }

    /* Start AR visuals hidden until target is found */
    sceneEl.addEventListener("loaded", () => {
      targets.forEach((t) => {
        if (t.frameEntity && t.frameEntity.object3D) {
          t.frameEntity.object3D.scale.set(0.001, 0.001, 0.001);
        }
        if (t.videoEntity && t.videoEntity.object3D) {
          t.videoEntity.object3D.scale.set(0.001, 0.001, 0.001);
        }
      });
    });
  </script>
</body>
</html>
