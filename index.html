<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MEMEVERSE AR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <style>
      /* Preload the comic-lettering font used for the dialogue bubble */
      @font-face {
        font-family: 'KalamBold';
        src: url('./fonts/Kalam-Bold.ttf') format('truetype');
        font-display: block;
      }
      #font-preload {
        font-family: 'KalamBold';
        position: fixed;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Forces the browser to actually load the font file before we draw
         canvas text with it — canvas text silently ignores fonts that
         haven't finished loading otherwise. -->
    <div id="font-preload">.</div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-assets>
        <video
          id="video"
          src="./video.mp4"
          preload="auto"
          loop="true"
          crossorigin="anonymous"
          playsinline
          webkit-playsinline
          muted
        ></video>
      </a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
        raycaster="objects: .clickable"
        cursor="fuse: false; rayOrigin: mouse"
      ></a-camera>

      <a-entity id="target0" mindar-image-target="targetIndex: 0">
        <a-video
          id="video-entity"
          class="clickable"
          src="#video"
          width="1"
          height="0.55"
          position="0 0 0"
          rotation="0 0 0"
        ></a-video>

        <!-- Dialogue words get injected here at runtime by dialogue-animator.js -->
        <a-entity id="dialogue-anchor" position="0 0.62 0.02"></a-entity>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector('#video');
      const targetEntity = document.querySelector('#target0');

      targetEntity.addEventListener('targetFound', () => {
        video.play();
        window.playDialogue('Battu....'); // <- change per comedian when you scale up
      });

      targetEntity.addEventListener('targetLost', () => {
        video.pause();
        window.hideDialogue();
      });

      const enableAudio = () => {
        if (video.muted) {
          video.muted = false;
          video.play();
        }
      };
      window.addEventListener('click', enableAudio);
      window.addEventListener('touchstart', enableAudio);
    </script>

    <script src="dialogue-animator.js"></script>
  </body>
</html>
